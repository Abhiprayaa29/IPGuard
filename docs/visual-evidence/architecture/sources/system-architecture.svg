      .txt { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .mono { fill: #a7f3d0; font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
      .mono-dim { fill: #94a3b8; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .pill-text { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .arrow { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-amber { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .arrow-red { stroke: #f87171; stroke-width: 2; fill: none; }
      .arrow-muted { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .step-num { fill: #090e13; font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
      .erd-pk { fill: #34d399; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-fk { fill: #38bdf8; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-col { fill: #cbd5e1; font-family: Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="770"/>
  <!-- subtle grid -->
  <g opacity="0.45">
    <line class="grid" x1="40" y1="0" x2="40" y2="770"/><line class="grid" x1="80" y1="0" x2="80" y2="770"/><line class="grid" x1="120" y1="0" x2="120" y2="770"/><line class="grid" x1="160" y1="0" x2="160" y2="770"/><line class="grid" x1="200" y1="0" x2="200" y2="770"/><line class="grid" x1="240" y1="0" x2="240" y2="770"/><line class="grid" x1="280" y1="0" x2="280" y2="770"/><line class="grid" x1="320" y1="0" x2="320" y2="770"/><line class="grid" x1="360" y1="0" x2="360" y2="770"/><line class="grid" x1="400" y1="0" x2="400" y2="770"/><line class="grid" x1="440" y1="0" x2="440" y2="770"/><line class="grid" x1="480" y1="0" x2="480" y2="770"/><line class="grid" x1="520" y1="0" x2="520" y2="770"/><line class="grid" x1="560" y1="0" x2="560" y2="770"/><line class="grid" x1="600" y1="0" x2="600" y2="770"/><line class="grid" x1="640" y1="0" x2="640" y2="770"/><line class="grid" x1="680" y1="0" x2="680" y2="770"/><line class="grid" x1="720" y1="0" x2="720" y2="770"/><line class="grid" x1="760" y1="0" x2="760" y2="770"/><line class="grid" x1="800" y1="0" x2="800" y2="770"/><line class="grid" x1="840" y1="0" x2="840" y2="770"/><line class="grid" x1="880" y1="0" x2="880" y2="770"/><line class="grid" x1="920" y1="0" x2="920" y2="770"/><line class="grid" x1="960" y1="0" x2="960" y2="770"/><line class="grid" x1="1000" y1="0" x2="1000" y2="770"/><line class="grid" x1="1040" y1="0" x2="1040" y2="770"/><line class="grid" x1="1080" y1="0" x2="1080" y2="770"/>
    <line class="grid" x1="0" y1="40" x2="1120" y2="40"/><line class="grid" x1="0" y1="80" x2="1120" y2="80"/><line class="grid" x1="0" y1="120" x2="1120" y2="120"/><line class="grid" x1="0" y1="160" x2="1120" y2="160"/><line class="grid" x1="0" y1="200" x2="1120" y2="200"/><line class="grid" x1="0" y1="240" x2="1120" y2="240"/><line class="grid" x1="0" y1="280" x2="1120" y2="280"/><line class="grid" x1="0" y1="320" x2="1120" y2="320"/><line class="grid" x1="0" y1="360" x2="1120" y2="360"/><line class="grid" x1="0" y1="400" x2="1120" y2="400"/><line class="grid" x1="0" y1="440" x2="1120" y2="440"/><line class="grid" x1="0" y1="480" x2="1120" y2="480"/><line class="grid" x1="0" y1="520" x2="1120" y2="520"/><line class="grid" x1="0" y1="560" x2="1120" y2="560"/><line class="grid" x1="0" y1="600" x2="1120" y2="600"/><line class="grid" x1="0" y1="640" x2="1120" y2="640"/><line class="grid" x1="0" y1="680" x2="1120" y2="680"/><line class="grid" x1="0" y1="720" x2="1120" y2="720"/><line class="grid" x1="0" y1="760" x2="1120" y2="760"/>
  </g>
  <!-- Header -->
  <text x="36" y="42" class="title">IPGuard System Architecture</text>
  <text x="36" y="64" class="subtitle">Implemented client, hardware keystore, FastAPI services, encrypted vault & planned M5 boundary</text>
  <rect x="884" y="22" width="200" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.2"/>
  <text x="984" y="40" text-anchor="middle" fill="#34d399" class="pill-text">VERIFIED M1-M4</text>
  <line x1="36" y1="80" x2="1084" y2="80" stroke="#1e293b" stroke-width="1"/>
  <rect class="card-blue" x="36" y="102" width="420" height="148" rx="12"/>
  <line x1="50" y1="134" x2="442" y2="134" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="120" r="4" fill="#38bdf8"/>
  <text x="66" y="125" class="h2">Web Console (React 19 + TypeScript + Vite)</text>
  <text x="52" y="154" class="txt">Routes: Overview, Devices, Notes, Vault, Stego Lab, Status</text>
  <text x="52" y="173" class="mono">Session Storage: sessionStorage bearer_token & channel_token</text>
  <text x="52" y="192" class="txt">No long-lived device private keys stored in browser</text><rect class="card-accent" x="500" y="102" width="580" height="148" rx="12"/>
  <line x1="514" y1="134" x2="1066" y2="134" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="518" cy="120" r="4" fill="#34d399"/>
  <text x="530" y="125" class="h2">Android Authenticator (SM-A546E / Kotlin + Compose)</text>
  <text x="516" y="154" class="txt">CameraX + ML Kit QR parser (rejects missing/stale tokens)</text>
  <text x="516" y="173" class="mono">Gate 1: Native OS BiometricPrompt (BIOMETRIC_WEAK pre-check)</text>
  <text x="516" y="192" class="mono">Gate 2: Keystore CryptoObject (BIOMETRIC_STRONG|DEVICE_CREDENTIAL)</text>
  <text x="516" y="211" class="txt">ECDSA secp256r1 non-exportable keypair (alias: ipguard_device_signing_v1)</text><rect class="card" x="36" y="294" width="1044" height="236" rx="12"/><text x="54" y="320" class="h2">FastAPI Core API Gateway &amp; Security Services (Python 3.13 + SQLAlchemy)</text><line x1="50" y1="332" x2="1064" y2="332" stroke="#1f2d3b" stroke-width="1"/><rect class="subcard" x="56" y="348" width="232" height="162" rx="12"/>
  <line x1="70" y1="380" x2="274" y2="380" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="74" cy="366" r="4" fill="#34d399"/>
  <text x="86" y="371" class="h2">Auth &amp; Device Lifecycle</text>
  <text x="72" y="400" class="mono">/auth/sessions, /devices/*</text>
  <text x="72" y="419" class="txt">1/1 single registered device</text>
  <text x="72" y="438" class="mono">ACTIVE / REVOKED / UNREG</text>
  <text x="72" y="457" class="txt">X-Account-Recovery-Key</text>
  <text x="72" y="476" class="txt">X-Browser-Channel-Token</text><rect class="subcard" x="312" y="348" width="232" height="162" rx="12"/>
  <line x1="326" y1="380" x2="530" y2="380" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="330" cy="366" r="4" fill="#38bdf8"/>
  <text x="342" y="371" class="h2">Secure Notes Service</text>
  <text x="328" y="400" class="mono">/notes CRUD endpoints</text>
  <text x="328" y="419" class="txt">HKDF-SHA256 per-device subkey</text>
  <text x="328" y="438" class="mono">AES-256-GCM (96-bit IV)</text>
  <text x="328" y="457" class="txt">Encrypts title_enc &amp; content_enc</text>
  <text x="328" y="476" class="txt">Zero plaintext in PostgreSQL</text><rect class="subcard" x="568" y="348" width="238" height="162" rx="12"/>
  <line x1="582" y1="380" x2="792" y2="380" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="586" cy="366" r="4" fill="#34d399"/>
  <text x="598" y="371" class="h2">Asset Vault &amp; Stego Lab</text>
  <text x="584" y="400" class="mono">/assets/* encrypted endpoints</text>
  <text x="584" y="419" class="mono">XChaCha20-Poly1305 AEAD</text>
  <text x="584" y="438" class="txt">SHA-256 integrity baseline</text>
  <text x="584" y="457" class="mono">PNG 1-bit RGB LSB (IPGW v1)</text>
  <text x="584" y="476" class="txt">Ed25519 watermark signatures</text><rect class="subcard" x="830" y="348" width="230" height="162" rx="12"/>
  <line x1="844" y1="380" x2="1046" y2="380" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="848" cy="366" r="4" fill="#34d399"/>
  <text x="860" y="371" class="h2">Audit Hash Chain</text>
  <text x="846" y="400" class="txt">Append-only SQLAlchemy events</text>
  <text x="846" y="419" class="mono">Row lock: AuditChainHead</text>
  <text x="846" y="438" class="mono">SHA-256(prev_hash + domain</text>
  <text x="846" y="457" class="mono">  + canonical_payload_utf8)</text>
  <text x="846" y="476" class="txt">Continuity &amp; genesis verifier</text><rect class="card-blue" x="36" y="574" width="410" height="152" rx="12"/>
  <line x1="50" y1="606" x2="432" y2="606" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="592" r="4" fill="#38bdf8"/>
  <text x="66" y="597" class="h2">PostgreSQL 17.11 Relational Store</text>
  <text x="52" y="626" class="mono">accounts, devices (partial unique idx 1/1)</text>
  <text x="52" y="645" class="mono">auth_sessions, notes (AES-256-GCM)</text>
  <text x="52" y="664" class="mono">assets (SHA-256 + source_asset_id lineage)</text>
  <text x="52" y="683" class="mono">audit_chain_heads &amp; audit_events ledger</text><rect class="card" x="470" y="574" width="300" height="152" rx="12"/>
  <line x1="484" y1="606" x2="756" y2="606" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="488" cy="592" r="4" fill="#34d399"/>
  <text x="500" y="597" class="h2">Local Encrypted Disk Vault</text>
  <text x="486" y="626" class="mono">backend/storage/ (ASSET_VAULT_DIR)</text>
  <text x="486" y="645" class="txt">Stores opaque XChaCha20-Poly1305</text>
  <text x="486" y="664" class="txt">ciphertexts under random storage_key</text>
  <text x="486" y="683" class="txt">Plaintext never written to disk</text><rect class="card-amber" x="794" y="574" width="286" height="152" rx="12"/>
  <line x1="808" y1="606" x2="1066" y2="606" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="812" cy="592" r="4" fill="#f59e0b"/>
  <text x="824" y="597" class="h2">M5 Blockchain Anchor [PLANNED]</text>
  <text x="810" y="626" class="mono">STATUS: NOT IMPLEMENTED IN M1-M4</text>
  <text x="810" y="645" class="txt">Future Merkle batching of audit_events</text>
  <text x="810" y="664" class="txt">Future EVM root commitment &amp; verifier</text>
  <text x="810" y="683" class="txt">Separated cleanly from M4 chain</text><path class="arrow-blue" d="M 246 250 L 246 294" marker-end="url(#m-blue)"/><text x="256" y="276" class="mono-dim">HTTPS / REST + Bearer</text><path class="arrow" d="M 790 250 L 790 294" marker-end="url(#m-emerald)"/><text x="800" y="276" class="mono-dim">ECDSA P-256 Challenge Signatures</text><path class="arrow-blue" d="M 240 530 L 240 574" marker-end="url(#m-blue)"/><path class="arrow" d="M 620 530 L 620 574" marker-end="url(#m-emerald)"/><path class="arrow-amber" d="M 945 510 L 945 574" marker-end="url(#m-amber)"/><text x="954" y="556" class="mono-dim">Future M5 Hook</text>
  <text x="36" y="756" class="mono-dim">IPGuard Source-Verified Visual Documentation  |  github.com/Abhiprayaa29/IPGuard</text>
</svg>