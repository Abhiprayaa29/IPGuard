<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770">
  <defs>
    <style>
      .bg { fill: #090e13; }
      .grid { stroke: #131c25; stroke-width: 1; }
      .card { fill: #101820; stroke: #22303e; stroke-width: 1.5; rx: 12; }
