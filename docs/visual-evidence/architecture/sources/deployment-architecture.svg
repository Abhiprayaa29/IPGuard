  <text x="36" y="42" class="title">Runtime & Deployment Architecture</text>
  <text x="36" y="64" class="subtitle">Verified local evaluation topology on Windows host + SM-A546E physical Android (no cloud claims)</text>
  <rect x="900" y="22" width="200" height="28" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-width="1.2"/>
