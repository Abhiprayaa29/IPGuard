  <text x="52" y="314" class="mono">  * audit_ipguard_test (tampering &amp; audit tests)</text>
  <text x="52" y="333" class="txt">Note: No cloud hosting or SaaS DB deployed</text><rect class="card-accent" x="515" y="110" width="325" height="220" rx="12"/>
  <line x1="529" y1="142" x2="826" y2="142" stroke="#1f2d3b" stroke-width="1"/>
