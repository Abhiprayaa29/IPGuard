  <text x="531" y="450" class="mono">  * MASTER_ENCRYPTION_KEY unset</text>
  <text x="531" y="469" class="txt">Rate limiting &amp; header redaction active</text><rect class="card-amber" x="870" y="110" width="230" height="420" rx="12"/>
  <line x1="884" y1="142" x2="1086" y2="142" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="888" cy="128" r="4" fill="#f59e0b"/>
