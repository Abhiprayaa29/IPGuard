  <text x="52" y="181" class="mono">FastAPI Uvicorn API — 0.0.0.0:8000</text>
  <text x="52" y="200" class="mono">PostgreSQL 17.11 — 127.0.0.1:5432 (db: ipguard)</text>
  <text x="52" y="219" class="mono">Local Encrypted Vault — backend/storage/*.enc</text>
  <text x="52" y="238" class="txt">Alembic Migrations: 0001..0011 applied</text>
  <text x="52" y="257" class="txt">CORS + Trusted Host strict origin enforcement</text>
