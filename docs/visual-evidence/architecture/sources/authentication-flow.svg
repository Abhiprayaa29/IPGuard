<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780">
  <defs>
    <style>
      .bg { fill: #090e13; }
      .grid { stroke: #131c25; stroke-width: 1; }
      .card { fill: #101820; stroke: #22303e; stroke-width: 1.5; rx: 12; }
      .card-accent { fill: #0e1d1c; stroke: #256859; stroke-width: 1.5; rx: 12; }
      .card-blue { fill: #0f1924; stroke: #254f73; stroke-width: 1.5; rx: 12; }
      .card-amber { fill: #1b160d; stroke: #8a611c; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .card-red { fill: #1c1114; stroke: #7f2932; stroke-width: 1.5; rx: 12; }
      .subcard { fill: #0c1319; stroke: #1d2a37; stroke-width: 1; rx: 8; }
      .title { fill: #f1f5f9; font-family: "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; }
      .h2 { fill: #e2e8f0; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .txt { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .mono { fill: #a7f3d0; font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
      .mono-dim { fill: #94a3b8; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .pill-text { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .arrow { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-amber { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .arrow-red { stroke: #f87171; stroke-width: 2; fill: none; }
      .arrow-muted { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .step-num { fill: #090e13; font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
      .erd-pk { fill: #34d399; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-fk { fill: #38bdf8; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-col { fill: #cbd5e1; font-family: Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="780"/>
  <!-- subtle grid -->
  <g opacity="0.45">
    <line class="grid" x1="40" y1="0" x2="40" y2="780"/><line class="grid" x1="80" y1="0" x2="80" y2="780"/><line class="grid" x1="120" y1="0" x2="120" y2="780"/><line class="grid" x1="160" y1="0" x2="160" y2="780"/><line class="grid" x1="200" y1="0" x2="200" y2="780"/><line class="grid" x1="240" y1="0" x2="240" y2="780"/><line class="grid" x1="280" y1="0" x2="280" y2="780"/><line class="grid" x1="320" y1="0" x2="320" y2="780"/><line class="grid" x1="360" y1="0" x2="360" y2="780"/><line class="grid" x1="400" y1="0" x2="400" y2="780"/><line class="grid" x1="440" y1="0" x2="440" y2="780"/><line class="grid" x1="480" y1="0" x2="480" y2="780"/><line class="grid" x1="520" y1="0" x2="520" y2="780"/><line class="grid" x1="560" y1="0" x2="560" y2="780"/><line class="grid" x1="600" y1="0" x2="600" y2="780"/><line class="grid" x1="640" y1="0" x2="640" y2="780"/><line class="grid" x1="680" y1="0" x2="680" y2="780"/><line class="grid" x1="720" y1="0" x2="720" y2="780"/><line class="grid" x1="760" y1="0" x2="760" y2="780"/><line class="grid" x1="800" y1="0" x2="800" y2="780"/><line class="grid" x1="840" y1="0" x2="840" y2="780"/><line class="grid" x1="880" y1="0" x2="880" y2="780"/><line class="grid" x1="920" y1="0" x2="920" y2="780"/><line class="grid" x1="960" y1="0" x2="960" y2="780"/><line class="grid" x1="1000" y1="0" x2="1000" y2="780"/><line class="grid" x1="1040" y1="0" x2="1040" y2="780"/><line class="grid" x1="1080" y1="0" x2="1080" y2="780"/>
    <line class="grid" x1="0" y1="40" x2="1120" y2="40"/><line class="grid" x1="0" y1="80" x2="1120" y2="80"/><line class="grid" x1="0" y1="120" x2="1120" y2="120"/><line class="grid" x1="0" y1="160" x2="1120" y2="160"/><line class="grid" x1="0" y1="200" x2="1120" y2="200"/><line class="grid" x1="0" y1="240" x2="1120" y2="240"/><line class="grid" x1="0" y1="280" x2="1120" y2="280"/><line class="grid" x1="0" y1="320" x2="1120" y2="320"/><line class="grid" x1="0" y1="360" x2="1120" y2="360"/><line class="grid" x1="0" y1="400" x2="1120" y2="400"/><line class="grid" x1="0" y1="440" x2="1120" y2="440"/><line class="grid" x1="0" y1="480" x2="1120" y2="480"/><line class="grid" x1="0" y1="520" x2="1120" y2="520"/><line class="grid" x1="0" y1="560" x2="1120" y2="560"/><line class="grid" x1="0" y1="600" x2="1120" y2="600"/><line class="grid" x1="0" y1="640" x2="1120" y2="640"/><line class="grid" x1="0" y1="680" x2="1120" y2="680"/><line class="grid" x1="0" y1="720" x2="1120" y2="720"/><line class="grid" x1="0" y1="760" x2="1120" y2="760"/>
  </g>
  <!-- Header -->
  <text x="36" y="42" class="title">QR Challenge-Response Authentication Flow</text>
  <text x="36" y="64" class="subtitle">Two-gate native biometric & hardware Keystore ECDSA signing flow with SEC-02 channel separation</text>
  <rect x="884" y="22" width="200" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.2"/>
  <text x="984" y="40" text-anchor="middle" fill="#34d399" class="pill-text">IMPLEMENTED M2+</text>
  <line x1="36" y1="80" x2="1084" y2="80" stroke="#1e293b" stroke-width="1"/>
  <rect x="44" y="100" width="172" height="44" rx="8" fill="#101820" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="127" text-anchor="middle" class="label">Web Console</text>
  <line x1="130" y1="144" x2="130" y2="675" stroke="#233242" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="279" y="100" width="172" height="44" rx="8" fill="#101820" stroke="#34d399" stroke-width="1.5"/>
  <text x="365" y="127" text-anchor="middle" class="label">FastAPI API</text>
  <line x1="365" y1="144" x2="365" y2="675" stroke="#233242" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="499" y="100" width="172" height="44" rx="8" fill="#101820" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="585" y="127" text-anchor="middle" class="label">PostgreSQL 17</text>
  <line x1="585" y1="144" x2="585" y2="675" stroke="#233242" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="719" y="100" width="172" height="44" rx="8" fill="#101820" stroke="#34d399" stroke-width="1.5"/>
  <text x="805" y="127" text-anchor="middle" class="label">Android App</text>
  <line x1="805" y1="144" x2="805" y2="675" stroke="#233242" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="924" y="100" width="172" height="44" rx="8" fill="#101820" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1010" y="127" text-anchor="middle" class="label">Keystore + Face</text>
  <line x1="1010" y1="144" x2="1010" y2="675" stroke="#233242" stroke-width="1.5" stroke-dasharray="5 5"/><path class="arrow-blue" d="M 130 185 L 365 185" marker-end="url(#m-blue)"/><circle cx="48" cy="181" r="10" fill="#34d399"/><text x="48" y="185" text-anchor="middle" class="step-num">1</text><text x="247" y="176" text-anchor="middle" class="mono">POST /auth/sessions</text><path class="arrow" d="M 365 232 L 585 232" marker-end="url(#m-emerald)"/><circle cx="48" cy="228" r="10" fill="#34d399"/><text x="48" y="232" text-anchor="middle" class="step-num">2</text><text x="475" y="223" text-anchor="middle" class="mono">INSERT PENDING session (60s TTL)</text><path class="arrow-blue" d="M 365 279 L 130 279" marker-end="url(#m-blue)"/><circle cx="48" cy="275" r="10" fill="#34d399"/><text x="48" y="279" text-anchor="middle" class="step-num">3</text><text x="247" y="270" text-anchor="middle" class="mono">QR payload + private X-Browser-Channel-Token</text><path class="arrow-blue" d="M 130 326 L 805 326" marker-end="url(#m-blue)"/><circle cx="48" cy="322" r="10" fill="#34d399"/><text x="48" y="326" text-anchor="middle" class="step-num">4</text><text x="467" y="317" text-anchor="middle" class="mono">CameraX scans QR (NO channel token in QR!)</text><path class="arrow-blue" d="M 805 376 L 1010 376" marker-end="url(#m-blue)"/><circle cx="48" cy="372" r="10" fill="#34d399"/><text x="48" y="376" text-anchor="middle" class="step-num">5</text><text x="907" y="367" text-anchor="middle" class="mono">Gate 1: BiometricPrompt (BIOMETRIC_WEAK)</text><path class="arrow" d="M 805 424 L 1010 424" marker-end="url(#m-emerald)"/><circle cx="48" cy="420" r="10" fill="#34d399"/><text x="48" y="424" text-anchor="middle" class="step-num">6</text><text x="907" y="415" text-anchor="middle" class="mono">Gate 2: Keystore CryptoObject -> Sign nonce</text><path class="arrow" d="M 1010 471 L 805 471" marker-end="url(#m-emerald)"/><circle cx="48" cy="467" r="10" fill="#34d399"/><text x="48" y="471" text-anchor="middle" class="step-num">7</text><text x="907" y="462" text-anchor="middle" class="mono">ECDSA P-256 signature (ASN.1 DER)</text><path class="arrow" d="M 805 518 L 365 518" marker-end="url(#m-emerald)"/><circle cx="48" cy="514" r="10" fill="#34d399"/><text x="48" y="518" text-anchor="middle" class="step-num">8</text><text x="585" y="509" text-anchor="middle" class="mono">POST /auth/sessions/{token}/verify</text><path class="arrow" d="M 365 565 L 585 565" marker-end="url(#m-emerald)"/><circle cx="48" cy="561" r="10" fill="#34d399"/><text x="48" y="565" text-anchor="middle" class="step-num">9</text><text x="475" y="556" text-anchor="middle" class="mono">SELECT FOR UPDATE + Verify ECDSA + Audit</text><path class="arrow-blue" d="M 130 612 L 365 612" marker-end="url(#m-blue)"/><circle cx="48" cy="608" r="10" fill="#34d399"/><text x="48" y="612" text-anchor="middle" class="step-num">10</text><text x="247" y="603" text-anchor="middle" class="mono">Poll with X-Browser-Channel-Token -> Bearer Token</text><rect class="subcard" x="36" y="690" width="1048" height="56" rx="12"/>
  <line x1="50" y1="722" x2="1070" y2="722" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="708" r="4" fill="#34d399"/>
  <text x="66" y="713" class="h2">Security Boundary Invariant (SEC-02)</text>
  <text x="52" y="742" class="txt">browser_channel_token stays strictly inside Web Browser sessionStorage and never enters the scanned QR payload or cross-browser hijack paths.</text>
  <text x="36" y="766" class="mono-dim">IPGuard Source-Verified Visual Documentation  |  github.com/Abhiprayaa29/IPGuard</text>
</svg>