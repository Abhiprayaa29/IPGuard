<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="650" viewBox="0 0 1136 650">
  <defs>
    <style>
      .bg { fill: #090e13; }
      .grid { stroke: #131c25; stroke-width: 1; }
      .card { fill: #101820; stroke: #22303e; stroke-width: 1.5; rx: 12; }
      .card-accent { fill: #0e1d1c; stroke: #256859; stroke-width: 1.5; rx: 12; }
      .card-blue { fill: #0f1924; stroke: #254f73; stroke-width: 1.5; rx: 12; }
      .card-amber { fill: #1b160d; stroke: #8a611c; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .card-red { fill: #1c1114; stroke: #7f2932; stroke-width: 1.5; rx: 12; }
      .subcard { fill: #0c1319; stroke: #1d2a37; stroke-width: 1; rx: 8; }
      .title { fill: #f1f5f9; font-family: "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; }
      .h2 { fill: #e2e8f0; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .txt { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .mono { fill: #a7f3d0; font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
      .mono-dim { fill: #94a3b8; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .pill-text { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .arrow { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-amber { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .arrow-red { stroke: #f87171; stroke-width: 2; fill: none; }
      .arrow-muted { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .step-num { fill: #090e13; font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
      .erd-pk { fill: #34d399; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-fk { fill: #38bdf8; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-col { fill: #cbd5e1; font-family: Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1136" height="650"/>
  <!-- subtle grid -->
  <g opacity="0.45">
    <line class="grid" x1="40" y1="0" x2="40" y2="650"/><line class="grid" x1="80" y1="0" x2="80" y2="650"/><line class="grid" x1="120" y1="0" x2="120" y2="650"/><line class="grid" x1="160" y1="0" x2="160" y2="650"/><line class="grid" x1="200" y1="0" x2="200" y2="650"/><line class="grid" x1="240" y1="0" x2="240" y2="650"/><line class="grid" x1="280" y1="0" x2="280" y2="650"/><line class="grid" x1="320" y1="0" x2="320" y2="650"/><line class="grid" x1="360" y1="0" x2="360" y2="650"/><line class="grid" x1="400" y1="0" x2="400" y2="650"/><line class="grid" x1="440" y1="0" x2="440" y2="650"/><line class="grid" x1="480" y1="0" x2="480" y2="650"/><line class="grid" x1="520" y1="0" x2="520" y2="650"/><line class="grid" x1="560" y1="0" x2="560" y2="650"/><line class="grid" x1="600" y1="0" x2="600" y2="650"/><line class="grid" x1="640" y1="0" x2="640" y2="650"/><line class="grid" x1="680" y1="0" x2="680" y2="650"/><line class="grid" x1="720" y1="0" x2="720" y2="650"/><line class="grid" x1="760" y1="0" x2="760" y2="650"/><line class="grid" x1="800" y1="0" x2="800" y2="650"/><line class="grid" x1="840" y1="0" x2="840" y2="650"/><line class="grid" x1="880" y1="0" x2="880" y2="650"/><line class="grid" x1="920" y1="0" x2="920" y2="650"/><line class="grid" x1="960" y1="0" x2="960" y2="650"/><line class="grid" x1="1000" y1="0" x2="1000" y2="650"/><line class="grid" x1="1040" y1="0" x2="1040" y2="650"/><line class="grid" x1="1080" y1="0" x2="1080" y2="650"/><line class="grid" x1="1120" y1="0" x2="1120" y2="650"/>
    <line class="grid" x1="0" y1="40" x2="1136" y2="40"/><line class="grid" x1="0" y1="80" x2="1136" y2="80"/><line class="grid" x1="0" y1="120" x2="1136" y2="120"/><line class="grid" x1="0" y1="160" x2="1136" y2="160"/><line class="grid" x1="0" y1="200" x2="1136" y2="200"/><line class="grid" x1="0" y1="240" x2="1136" y2="240"/><line class="grid" x1="0" y1="280" x2="1136" y2="280"/><line class="grid" x1="0" y1="320" x2="1136" y2="320"/><line class="grid" x1="0" y1="360" x2="1136" y2="360"/><line class="grid" x1="0" y1="400" x2="1136" y2="400"/><line class="grid" x1="0" y1="440" x2="1136" y2="440"/><line class="grid" x1="0" y1="480" x2="1136" y2="480"/><line class="grid" x1="0" y1="520" x2="1136" y2="520"/><line class="grid" x1="0" y1="560" x2="1136" y2="560"/><line class="grid" x1="0" y1="600" x2="1136" y2="600"/><line class="grid" x1="0" y1="640" x2="1136" y2="640"/>
  </g>
  <!-- Header -->
  <text x="36" y="42" class="title">Account & Device Lifecycle State Machine</text>
  <text x="36" y="64" class="subtitle">Single-registered-device enforcement, slot lock under REVOKED state, and Recovery Key restoration</text>
  <rect x="900" y="22" width="200" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.2"/>
  <text x="1000" y="40" text-anchor="middle" fill="#34d399" class="pill-text">VERIFIED STATE MACHINE</text>
  <line x1="36" y1="80" x2="1100" y2="80" stroke="#1e293b" stroke-width="1"/>
  <rect class="card-blue" x="36" y="130" width="300" height="164" rx="12"/>
  <line x1="50" y1="162" x2="322" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="148" r="4" fill="#38bdf8"/>
  <text x="66" y="153" class="h2">UNREGISTERED (0 / 1 Slot)</text>
  <text x="52" y="182" class="txt">No active device bound to account</text>
  <text x="52" y="201" class="txt">QR Authentication blocked until</text>
  <text x="52" y="220" class="txt">one device completes M2 enrollment</text>
  <text x="52" y="239" class="mono">Partial unique index permits bind</text>
  <text x="52" y="258" class="txt">Protected Notes/Assets remain stored</text><rect class="card-accent" x="425" y="130" width="320" height="164" rx="12"/>
  <line x1="439" y1="162" x2="731" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="443" cy="148" r="4" fill="#34d399"/>
  <text x="455" y="153" class="h2">ACTIVE (1 / 1 Slot Locked)</text>
  <text x="441" y="182" class="txt">Exactly one physical phone bound</text>
  <text x="441" y="201" class="txt">Single-device index enforces lock:</text>
  <text x="441" y="220" class="mono">status IN ('ACTIVE', 'REVOKED')</text>
  <text x="441" y="239" class="txt">Approves QR logins &amp; Vault/Notes</text>
  <text x="441" y="258" class="txt">Hardware ECDSA P-256 key trusted</text><rect class="card-red" x="425" y="420" width="320" height="174" rx="12"/>
  <line x1="439" y1="452" x2="731" y2="452" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="443" cy="438" r="4" fill="#f87171"/>
  <text x="455" y="443" class="h2">REVOKED (1 / 1 Slot LOCKED)</text>
  <text x="441" y="472" class="txt">Slot stays occupied (1/1) by design!</text>
  <text x="441" y="491" class="txt">Blocks replacement hijack without</text>
  <text x="441" y="510" class="txt">explicit recovery or unregistration</text>
  <text x="441" y="529" class="mono">Active &amp; pending auth sessions killed</text>
  <text x="441" y="548" class="txt">Same hardware key retained on device</text><rect class="card" x="810" y="260" width="290" height="210" rx="12"/>
  <line x1="824" y1="292" x2="1086" y2="292" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="828" cy="278" r="4" fill="#f59e0b"/>
  <text x="840" y="283" class="h2">Account Recovery Boundary</text>
  <text x="826" y="312" class="mono">Header: X-Account-Recovery-Key</text>
  <text x="826" y="331" class="txt">Backend verifies SHA-256 digest</text>
  <text x="826" y="350" class="mono">Constant-time hmac.compare_digest</text>
  <text x="826" y="369" class="txt">Rate-limited per IP &amp; failure</text>
  <text x="826" y="388" class="txt">All attempts redacted &amp; audited</text>
  <text x="826" y="407" class="mono">Returns HTTP 503 if unconfigured</text><path class="arrow" d="M 336 185 L 425 185" marker-end="url(#m-emerald)"/><text x="380" y="172" text-anchor="middle" class="mono">Enroll (QR)</text><path class="arrow-red" d="M 525 294 L 525 420" marker-end="url(#m-red)"/><text x="462" y="360" text-anchor="middle" class="mono">Revoke Access</text><path class="arrow" d="M 645 420 L 645 294" marker-end="url(#m-emerald)"/><text x="722" y="360" text-anchor="middle" class="mono">Restore (Recovery Key)</text><path class="arrow-blue" d="M 425 245 L 336 245" marker-end="url(#m-blue)"/><text x="380" y="274" text-anchor="middle" class="mono-dim">Unregister</text><text x="380" y="290" text-anchor="middle" class="mono-dim">(Frees 0/1)</text><path class="arrow-blue" d="M 425 510 Q 186 510 186 294" marker-end="url(#m-blue)"/><text x="275" y="534" text-anchor="middle" class="mono-dim">Unregister Revoked Device (Frees 0/1 Slot)</text><path class="arrow-amber" d="M 810 435 L 745 470" marker-end="url(#m-amber)"/>
  <text x="36" y="636" class="mono-dim">IPGuard Source-Verified Visual Documentation  |  github.com/Abhiprayaa29/IPGuard</text>
</svg>