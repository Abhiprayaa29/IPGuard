  <!-- Header -->
  <text x="36" y="42" class="title">PostgreSQL 17.11 Entity-Relationship Diagram</text>
  <text x="36" y="64" class="subtitle">Relational schema matching Alembic migrations 0001-0011 (exact tables, FKs, and constraints)</text>
  <rect x="910" y="22" width="200" height="28" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-width="1.2"/>
