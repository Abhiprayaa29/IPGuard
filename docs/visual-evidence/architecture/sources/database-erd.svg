  <rect x="36" y="108" width="280" height="32" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="50" y="129" class="h2">accounts</text>
  <text x="48" y="160" class="erd-pk">PK  account_id</text>
  <text x="304" y="160" text-anchor="end" class="mono-dim">varchar(64)</text>
  <text x="48" y="179" class="erd-col">    display_name</text>
  <text x="304" y="179" text-anchor="end" class="mono-dim">varchar(120)</text>
  <text x="48" y="198" class="erd-col">    created_at</text>
  <text x="304" y="198" text-anchor="end" class="mono-dim">timestamptz</text><rect class="card" x="360" y="108" width="355" height="170" rx="10"/>
  <rect x="360" y="108" width="355" height="32" rx="10" fill="#34d399" fill-opacity="0.14"/>
  <text x="374" y="129" class="h2">devices</text>
  <text x="372" y="160" class="erd-pk">PK  id</text>
  <text x="703" y="160" text-anchor="end" class="mono-dim">uuid</text>
  <text x="372" y="179" class="erd-fk">UK  device_id</text>
  <text x="703" y="179" text-anchor="end" class="mono-dim">varchar(64)</text>
  <text x="372" y="198" class="erd-fk">FK  account_id</text>
  <text x="703" y="198" text-anchor="end" class="mono-dim">-> accounts.account_id</text>
  <text x="372" y="217" class="erd-col">    public_key</text>
  <text x="703" y="217" text-anchor="end" class="mono-dim">text (ECDSA SPKI)</text>
  <text x="372" y="236" class="erd-col">    status</text>
  <text x="703" y="236" text-anchor="end" class="mono-dim">ACTIVE|REVOKED|UNREG</text>
  <text x="372" y="255" class="erd-col">    enrolled_at / revoked_at</text>
  <text x="703" y="255" text-anchor="end" class="mono-dim">timestamptz</text><rect class="card" x="765" y="108" width="345" height="189" rx="10"/>
  <rect x="765" y="108" width="345" height="32" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="779" y="129" class="h2">auth_sessions</text>
  <text x="777" y="160" class="erd-pk">PK  id</text>
  <text x="1098" y="160" text-anchor="end" class="mono-dim">uuid</text>
  <text x="777" y="179" class="erd-fk">UK  session_token</text>
  <text x="1098" y="179" text-anchor="end" class="mono-dim">varchar(128)</text>
  <text x="777" y="198" class="erd-fk">FK  account_id</text>
  <text x="1098" y="198" text-anchor="end" class="mono-dim">-> accounts.account_id</text>
  <text x="777" y="217" class="erd-fk">FK  device_id (nullable)</text>
  <text x="1098" y="217" text-anchor="end" class="mono-dim">-> devices.id</text>
  <text x="777" y="236" class="erd-col">    status</text>
  <text x="1098" y="236" text-anchor="end" class="mono-dim">PENDING|APPROVED|USED</text>
  <text x="777" y="255" class="erd-col">    browser_channel_token_hash</text>
  <text x="1098" y="255" text-anchor="end" class="mono-dim">varchar(64)</text>
  <text x="777" y="274" class="erd-col">    expires_at / consumed_at</text>
  <text x="1098" y="274" text-anchor="end" class="mono-dim">timestamptz</text><rect class="card" x="36" y="390" width="290" height="151" rx="10"/>
  <rect x="36" y="390" width="290" height="32" rx="10" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="50" y="411" class="h2">notes (AES-256-GCM)</text>
  <text x="48" y="442" class="erd-pk">PK  id</text>
  <text x="314" y="442" text-anchor="end" class="mono-dim">uuid</text>
  <text x="48" y="461" class="erd-col">    owner_id</text>
  <text x="314" y="461" text-anchor="end" class="mono-dim">varchar(64) (device_id)</text>
  <text x="48" y="480" class="erd-col">    title_enc</text>
  <text x="314" y="480" text-anchor="end" class="mono-dim">text (v1$b64)</text>
  <text x="48" y="499" class="erd-col">    content_enc</text>
  <text x="314" y="499" text-anchor="end" class="mono-dim">text (v1$b64)</text>
  <text x="48" y="518" class="erd-col">    created_at / updated_at</text>
  <text x="314" y="518" text-anchor="end" class="mono-dim">timestamptz</text><rect class="card" x="360" y="390" width="355" height="208" rx="10"/>
  <rect x="360" y="390" width="355" height="32" rx="10" fill="#34d399" fill-opacity="0.14"/>
  <text x="374" y="411" class="h2">assets (XChaCha20-Poly1305)</text>
  <text x="372" y="442" class="erd-pk">PK  id</text>
  <text x="703" y="442" text-anchor="end" class="mono-dim">uuid</text>
  <text x="372" y="461" class="erd-fk">FK  device_id</text>
  <text x="703" y="461" text-anchor="end" class="mono-dim">-> devices.device_id</text>
  <text x="372" y="480" class="erd-fk">UK  storage_key</text>
  <text x="703" y="480" text-anchor="end" class="mono-dim">varchar(100)</text>
  <text x="372" y="499" class="erd-col">    nonce / sha256_hash</text>
  <text x="703" y="499" text-anchor="end" class="mono-dim">varchar(64)</text>
  <text x="372" y="518" class="erd-col">    integrity_status</text>
  <text x="703" y="518" text-anchor="end" class="mono-dim">VERIFIED|TAMPERED</text>
  <text x="372" y="537" class="erd-fk">FK  source_asset_id (self)</text>
  <text x="703" y="537" text-anchor="end" class="mono-dim">-> assets.id</text>
  <text x="372" y="556" class="erd-col">    derivative_type</text>
  <text x="703" y="556" text-anchor="end" class="mono-dim">PNG_LSB / null</text>
  <text x="372" y="575" class="erd-col">    watermark_id / stego_ver</text>
  <text x="703" y="575" text-anchor="end" class="mono-dim">uuid / int</text><rect class="card" x="765" y="345" width="345" height="132" rx="10"/>
  <rect x="765" y="345" width="345" height="32" rx="10" fill="#34d399" fill-opacity="0.14"/>
  <text x="779" y="366" class="h2">audit_chain_heads</text>
  <text x="777" y="397" class="erd-pk">PK  chain_id</text>
  <text x="1098" y="397" text-anchor="end" class="mono-dim">varchar(64)</text>
  <text x="777" y="416" class="erd-col">    last_sequence</text>
  <text x="1098" y="416" text-anchor="end" class="mono-dim">bigint</text>
  <text x="777" y="435" class="erd-col">    last_hash</text>
  <text x="1098" y="435" text-anchor="end" class="mono-dim">varchar(64) hex</text>
  <text x="777" y="454" class="erd-col">    updated_at</text>
  <text x="1098" y="454" text-anchor="end" class="mono-dim">timestamptz</text><rect class="card" x="765" y="495" width="345" height="170" rx="10"/>
  <rect x="765" y="495" width="345" height="32" rx="10" fill="#f59e0b" fill-opacity="0.14"/>
  <text x="779" y="516" class="h2">audit_events (Append-Only)</text>
  <text x="777" y="547" class="erd-pk">PK  event_id</text>
  <text x="1098" y="547" text-anchor="end" class="mono-dim">uuid</text>
  <text x="777" y="566" class="erd-fk">FK  chain_id</text>
  <text x="1098" y="566" text-anchor="end" class="mono-dim">-> chain_heads.chain_id</text>
  <text x="777" y="585" class="erd-fk">UK  sequence</text>
  <text x="1098" y="585" text-anchor="end" class="mono-dim">bigint (chain,seq)</text>
  <text x="777" y="604" class="erd-col">    event_type / result</text>
  <text x="1098" y="604" text-anchor="end" class="mono-dim">varchar</text>
  <text x="777" y="623" class="erd-col">    canonical_payload</text>
  <text x="1098" y="623" text-anchor="end" class="mono-dim">bytea UTF-8</text>
  <text x="777" y="642" class="erd-col">    prev_hash / event_hash</text>
