<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="455" viewBox="0 0 1136 455">
  <defs>
    <style>
      .bg { fill: #090e13; }
      .grid { stroke: #131c25; stroke-width: 1; }
      .card { fill: #101820; stroke: #22303e; stroke-width: 1.5; rx: 12; }
      .card-accent { fill: #0e1d1c; stroke: #256859; stroke-width: 1.5; rx: 12; }
      .card-blue { fill: #0f1924; stroke: #254f73; stroke-width: 1.5; rx: 12; }
      .card-amber { fill: #1b160d; stroke: #8a611c; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .card-red { fill: #1c1114; stroke: #7f2932; stroke-width: 1.5; rx: 12; }
      .subcard { fill: #0c1319; stroke: #1d2a37; stroke-width: 1; rx: 8; }
      .title { fill: #f1f5f9; font-family: "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; }
      .h2 { fill: #e2e8f0; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .txt { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .mono { fill: #a7f3d0; font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
      .mono-dim { fill: #94a3b8; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .pill-text { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .arrow { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-amber { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .arrow-red { stroke: #f87171; stroke-width: 2; fill: none; }
      .arrow-muted { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .step-num { fill: #090e13; font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
      .erd-pk { fill: #34d399; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-fk { fill: #38bdf8; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-col { fill: #cbd5e1; font-family: Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1136" height="455"/>
  <!-- subtle grid -->
  <g opacity="0.45">
    <line class="grid" x1="40" y1="0" x2="40" y2="455"/><line class="grid" x1="80" y1="0" x2="80" y2="455"/><line class="grid" x1="120" y1="0" x2="120" y2="455"/><line class="grid" x1="160" y1="0" x2="160" y2="455"/><line class="grid" x1="200" y1="0" x2="200" y2="455"/><line class="grid" x1="240" y1="0" x2="240" y2="455"/><line class="grid" x1="280" y1="0" x2="280" y2="455"/><line class="grid" x1="320" y1="0" x2="320" y2="455"/><line class="grid" x1="360" y1="0" x2="360" y2="455"/><line class="grid" x1="400" y1="0" x2="400" y2="455"/><line class="grid" x1="440" y1="0" x2="440" y2="455"/><line class="grid" x1="480" y1="0" x2="480" y2="455"/><line class="grid" x1="520" y1="0" x2="520" y2="455"/><line class="grid" x1="560" y1="0" x2="560" y2="455"/><line class="grid" x1="600" y1="0" x2="600" y2="455"/><line class="grid" x1="640" y1="0" x2="640" y2="455"/><line class="grid" x1="680" y1="0" x2="680" y2="455"/><line class="grid" x1="720" y1="0" x2="720" y2="455"/><line class="grid" x1="760" y1="0" x2="760" y2="455"/><line class="grid" x1="800" y1="0" x2="800" y2="455"/><line class="grid" x1="840" y1="0" x2="840" y2="455"/><line class="grid" x1="880" y1="0" x2="880" y2="455"/><line class="grid" x1="920" y1="0" x2="920" y2="455"/><line class="grid" x1="960" y1="0" x2="960" y2="455"/><line class="grid" x1="1000" y1="0" x2="1000" y2="455"/><line class="grid" x1="1040" y1="0" x2="1040" y2="455"/><line class="grid" x1="1080" y1="0" x2="1080" y2="455"/><line class="grid" x1="1120" y1="0" x2="1120" y2="455"/>
    <line class="grid" x1="0" y1="40" x2="1136" y2="40"/><line class="grid" x1="0" y1="80" x2="1136" y2="80"/><line class="grid" x1="0" y1="120" x2="1136" y2="120"/><line class="grid" x1="0" y1="160" x2="1136" y2="160"/><line class="grid" x1="0" y1="200" x2="1136" y2="200"/><line class="grid" x1="0" y1="240" x2="1136" y2="240"/><line class="grid" x1="0" y1="280" x2="1136" y2="280"/><line class="grid" x1="0" y1="320" x2="1136" y2="320"/><line class="grid" x1="0" y1="360" x2="1136" y2="360"/><line class="grid" x1="0" y1="400" x2="1136" y2="400"/><line class="grid" x1="0" y1="440" x2="1136" y2="440"/>
  </g>
  <!-- Header -->
  <text x="36" y="42" class="title">Digital Asset Vault AEAD & Integrity Pipeline</text>
  <text x="36" y="64" class="subtitle">XChaCha20-Poly1305 (192-bit nonce) ciphertext storage paired with SHA-256 baseline monitoring</text>
  <rect x="900" y="22" width="200" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.2"/>
  <text x="1000" y="40" text-anchor="middle" fill="#34d399" class="pill-text">VERIFIED M3-M4</text>
  <line x1="36" y1="80" x2="1100" y2="80" stroke="#1e293b" stroke-width="1"/>
  <rect class="card-blue" x="36" y="130" width="235" height="260" rx="12"/>
  <line x1="50" y1="162" x2="257" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="148" r="4" fill="#38bdf8"/>
  <text x="66" y="153" class="h2">1. Upload &amp; Baseline</text>
  <text x="52" y="182" class="txt">Raw file in memory</text>
  <text x="52" y="201" class="txt">Compute SHA-256 hex of</text>
  <text x="52" y="220" class="mono">original file bytes</text>
  <text x="52" y="239" class="txt">Stored as integrity</text>
  <text x="52" y="258" class="txt">baseline in PostgreSQL</text>
  <text x="52" y="277" class="txt">Optional PNG validation</text><rect class="card-accent" x="308" y="130" width="260" height="260" rx="12"/>
  <line x1="322" y1="162" x2="554" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="326" cy="148" r="4" fill="#34d399"/>
  <text x="338" y="153" class="h2">2. XChaCha20-Poly1305</text>
  <text x="324" y="182" class="mono">HKDF-SHA256 subkey</text>
  <text x="324" y="201" class="mono">192-bit (24B) nonce</text>
  <text x="324" y="220" class="txt">AAD binds asset metadata</text>
  <text x="324" y="239" class="mono">128-bit Poly1305 MAC tag</text>
  <text x="324" y="258" class="txt">Mitigates nonce reuse</text>
  <text x="324" y="277" class="txt">across large vaults</text><rect class="card" x="605" y="130" width="240" height="260" rx="12"/>
  <line x1="619" y1="162" x2="831" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="623" cy="148" r="4" fill="#34d399"/>
  <text x="635" y="153" class="h2">3. Storage Isolation</text>
  <text x="621" y="182" class="mono">Disk: backend/storage/</text>
  <text x="621" y="201" class="txt">Opaque random UUID</text>
  <text x="621" y="220" class="mono">storage_key filename</text>
  <text x="621" y="239" class="txt">No plaintext bytes ever</text>
  <text x="621" y="258" class="txt">flushed to filesystem</text>
  <text x="621" y="277" class="txt">Original filename stays</text>
  <text x="621" y="296" class="txt">only in DB metadata</text><rect class="card-blue" x="882" y="130" width="220" height="260" rx="12"/>
  <line x1="896" y1="162" x2="1088" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="900" cy="148" r="4" fill="#38bdf8"/>
  <text x="912" y="153" class="h2">4. Integrity Monitor</text>
  <text x="898" y="182" class="txt">Decrypt in memory -></text>
  <text x="898" y="201" class="mono">re-hash SHA-256</text>
  <text x="898" y="220" class="mono">Compare == baseline</text>
  <text x="898" y="239" class="txt">Detects disk/DB</text>
  <text x="898" y="258" class="mono">tampering -> TAMPERED</text>
  <text x="898" y="277" class="txt">Updates AuditEvent</text><path class="arrow-blue" d="M 271 260 L 308 260" marker-end="url(#m-blue)"/><path class="arrow" d="M 568 260 L 605 260" marker-end="url(#m-emerald)"/><path class="arrow" d="M 845 260 L 882 260" marker-end="url(#m-blue)"/>
  <text x="36" y="441" class="mono-dim">IPGuard Source-Verified Visual Documentation  |  github.com/Abhiprayaa29/IPGuard</text>
</svg>