<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="435" viewBox="0 0 1136 435">
  <defs>
    <style>
      .bg { fill: #090e13; }
      .grid { stroke: #131c25; stroke-width: 1; }
      .card { fill: #101820; stroke: #22303e; stroke-width: 1.5; rx: 12; }
      .card-accent { fill: #0e1d1c; stroke: #256859; stroke-width: 1.5; rx: 12; }
      .card-blue { fill: #0f1924; stroke: #254f73; stroke-width: 1.5; rx: 12; }
      .card-amber { fill: #1b160d; stroke: #8a611c; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .card-red { fill: #1c1114; stroke: #7f2932; stroke-width: 1.5; rx: 12; }
      .subcard { fill: #0c1319; stroke: #1d2a37; stroke-width: 1; rx: 8; }
      .title { fill: #f1f5f9; font-family: "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; }
      .h2 { fill: #e2e8f0; font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .txt { fill: #94a3b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .mono { fill: #a7f3d0; font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
      .mono-dim { fill: #94a3b8; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .pill-text { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .arrow { stroke: #34d399; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-amber { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .arrow-red { stroke: #f87171; stroke-width: 2; fill: none; }
      .arrow-muted { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .step-num { fill: #090e13; font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; }
      .erd-pk { fill: #34d399; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-fk { fill: #38bdf8; font-family: Consolas, monospace; font-size: 11px; font-weight: 700; }
      .erd-col { fill: #cbd5e1; font-family: Consolas, monospace; font-size: 11px; }
    </style>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1136" height="435"/>
  <!-- subtle grid -->
  <g opacity="0.45">
    <line class="grid" x1="40" y1="0" x2="40" y2="435"/><line class="grid" x1="80" y1="0" x2="80" y2="435"/><line class="grid" x1="120" y1="0" x2="120" y2="435"/><line class="grid" x1="160" y1="0" x2="160" y2="435"/><line class="grid" x1="200" y1="0" x2="200" y2="435"/><line class="grid" x1="240" y1="0" x2="240" y2="435"/><line class="grid" x1="280" y1="0" x2="280" y2="435"/><line class="grid" x1="320" y1="0" x2="320" y2="435"/><line class="grid" x1="360" y1="0" x2="360" y2="435"/><line class="grid" x1="400" y1="0" x2="400" y2="435"/><line class="grid" x1="440" y1="0" x2="440" y2="435"/><line class="grid" x1="480" y1="0" x2="480" y2="435"/><line class="grid" x1="520" y1="0" x2="520" y2="435"/><line class="grid" x1="560" y1="0" x2="560" y2="435"/><line class="grid" x1="600" y1="0" x2="600" y2="435"/><line class="grid" x1="640" y1="0" x2="640" y2="435"/><line class="grid" x1="680" y1="0" x2="680" y2="435"/><line class="grid" x1="720" y1="0" x2="720" y2="435"/><line class="grid" x1="760" y1="0" x2="760" y2="435"/><line class="grid" x1="800" y1="0" x2="800" y2="435"/><line class="grid" x1="840" y1="0" x2="840" y2="435"/><line class="grid" x1="880" y1="0" x2="880" y2="435"/><line class="grid" x1="920" y1="0" x2="920" y2="435"/><line class="grid" x1="960" y1="0" x2="960" y2="435"/><line class="grid" x1="1000" y1="0" x2="1000" y2="435"/><line class="grid" x1="1040" y1="0" x2="1040" y2="435"/><line class="grid" x1="1080" y1="0" x2="1080" y2="435"/><line class="grid" x1="1120" y1="0" x2="1120" y2="435"/>
    <line class="grid" x1="0" y1="40" x2="1136" y2="40"/><line class="grid" x1="0" y1="80" x2="1136" y2="80"/><line class="grid" x1="0" y1="120" x2="1136" y2="120"/><line class="grid" x1="0" y1="160" x2="1136" y2="160"/><line class="grid" x1="0" y1="200" x2="1136" y2="200"/><line class="grid" x1="0" y1="240" x2="1136" y2="240"/><line class="grid" x1="0" y1="280" x2="1136" y2="280"/><line class="grid" x1="0" y1="320" x2="1136" y2="320"/><line class="grid" x1="0" y1="360" x2="1136" y2="360"/><line class="grid" x1="0" y1="400" x2="1136" y2="400"/>
  </g>
  <!-- Header -->
  <text x="36" y="42" class="title">Secure Notes Envelope Encryption Pipeline</text>
  <text x="36" y="64" class="subtitle">HKDF-SHA256 per-device subkey derivation + AES-256-GCM authenticated encryption</text>
  <rect x="900" y="22" width="200" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.2"/>
  <text x="1000" y="40" text-anchor="middle" fill="#34d399" class="pill-text">VERIFIED M3</text>
  <line x1="36" y1="80" x2="1100" y2="80" stroke="#1e293b" stroke-width="1"/>
  <rect class="card-blue" x="36" y="130" width="240" height="240" rx="12"/>
  <line x1="50" y1="162" x2="262" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="54" cy="148" r="4" fill="#38bdf8"/>
  <text x="66" y="153" class="h2">1. Master Key &amp; KDF</text>
  <text x="52" y="182" class="mono">MASTER_ENCRYPTION_KEY</text>
  <text x="52" y="201" class="txt">Loaded from backend env</text>
  <text x="52" y="220" class="txt">HKDF-SHA256 extracts</text>
  <text x="52" y="239" class="mono">deterministic 32-byte key</text>
  <text x="52" y="258" class="txt">Info binds device_id:</text>
  <text x="52" y="277" class="txt">multi-device isolation</text><rect class="card-accent" x="316" y="130" width="255" height="240" rx="12"/>
  <line x1="330" y1="162" x2="557" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="334" cy="148" r="4" fill="#34d399"/>
  <text x="346" y="153" class="h2">2. AES-256-GCM AEAD</text>
  <text x="332" y="182" class="mono">256-bit derived subkey</text>
  <text x="332" y="201" class="mono">96-bit fresh CSPRNG IV</text>
  <text x="332" y="220" class="txt">Authenticated Additional</text>
  <text x="332" y="239" class="txt">Data (AAD) binds owner</text>
  <text x="332" y="258" class="txt">Separate encryption for</text>
  <text x="332" y="277" class="mono">title_enc &amp; content_enc</text><rect class="card" x="611" y="130" width="245" height="240" rx="12"/>
  <line x1="625" y1="162" x2="842" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="629" cy="148" r="4" fill="#34d399"/>
  <text x="641" y="153" class="h2">3. Wire Serialization</text>
  <text x="627" y="182" class="mono">Prefix: v1$</text>
  <text x="627" y="201" class="txt">Base64 payload packs:</text>
  <text x="627" y="220" class="mono">[12B IV | Ciphertext</text>
  <text x="627" y="239" class="mono"> | 16B GCM Auth Tag]</text>
  <text x="627" y="258" class="txt">Detects any DB bit flip</text>
  <text x="627" y="277" class="txt">on decryption attempt</text><rect class="card-blue" x="896" y="130" width="205" height="240" rx="12"/>
  <line x1="910" y1="162" x2="1087" y2="162" stroke="#1f2d3b" stroke-width="1"/>
  <circle cx="914" cy="148" r="4" fill="#38bdf8"/>
  <text x="926" y="153" class="h2">4. PostgreSQL Row</text>
  <text x="912" y="182" class="mono">Table: notes</text>
  <text x="912" y="201" class="mono">owner_id = device_id</text>
  <text x="912" y="220" class="mono">title_enc = v1$...</text>
  <text x="912" y="239" class="mono">content_enc = v1$...</text>
  <text x="912" y="258" class="txt">Zero plaintext stored</text>
  <text x="912" y="277" class="txt">Preserved on unreg</text><path class="arrow-blue" d="M 276 250 L 316 250" marker-end="url(#m-blue)"/><path class="arrow" d="M 571 250 L 611 250" marker-end="url(#m-emerald)"/><path class="arrow" d="M 856 250 L 896 250" marker-end="url(#m-blue)"/>
  <text x="36" y="421" class="mono-dim">IPGuard Source-Verified Visual Documentation  |  github.com/Abhiprayaa29/IPGuard</text>
</svg>