  <text x="320" y="248" class="txt">SQLAlchemy blocks UPDATE</text>
  <text x="320" y="267" class="txt">and DELETE via listeners</text><rect class="card-accent" x="572" y="120" width="232" height="240" rx="12"/>
  <line x1="586" y1="152" x2="790" y2="152" stroke="#1f2d3b" stroke-width="1"/>
