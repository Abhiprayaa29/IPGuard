  <circle cx="54" cy="418" r="4" fill="#34d399"/>
  <text x="66" y="423" class="h2">Audit Integrity Verification Boundary (Honest Assessment)</text>
  <text x="52" y="452" class="txt">M4 provides deterministic tamper-EVIDENCE inside PostgreSQL (any modification to payload bytes, prev_hash, event_hash, or sequence deletion/reordering fails</text>
  <text x="52" y="471" class="txt">hash recomputation immediately). Full external immutability requires Milestone 5 Merkle checkpoint anchoring to a public/consortium ledger (PLANNED).</text><path class="arrow-blue" d="M 268 240 L 304 240" marker-end="url(#m-blue)"/><path class="arrow" d="M 536 240 L 572 240" marker-end="url(#m-emerald)"/><path class="arrow-amber" d="M 804 240 L 840 240" marker-end="url(#m-amber)"/>
