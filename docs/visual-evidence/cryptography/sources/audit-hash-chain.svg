  <text x="856" y="229" class="txt">* Smart contract anchoring</text>
  <text x="856" y="248" class="txt">* Independent proof portal</text>
  <text x="856" y="267" class="txt">Does NOT claim tamper-proof</text><rect class="subcard" x="36" y="400" width="1064" height="118" rx="12"/>
